<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#381a23" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta
      name="description"
      content="A little പിറന്നാൾ journey, made with love for Kudu."
    />
    <title>Happy പിറന്നാൾ Kudu ❤️</title>
    <link rel="icon" href="assets/icons/heart.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/content.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <a class="wordmark" href="#" id="home-link" aria-label="Journey home"
        ><span class="brand-flower">✳</span> for my Kudu<span class="brand-dot"
          >.</span
        ></a
      >
      <span class="top-note">A LITTLE WORLD, JUST FOR YOU</span>
      <button
        class="icon-button"
        id="menu-toggle"
        aria-label="Open journey menu"
        aria-expanded="false"
      >
        ☰
      </button>
    </header>
    <nav class="menu" id="menu" aria-label="Journey settings" hidden>
      <p>Our little journey</p>
      <button id="sound-toggle">Sound off ♫</button>
      <button id="previous">Previous memory</button>
      <button id="return-current">Return to your surprise</button>
      <button id="restart">Restart journey</button>
      <small>Your place is saved on this device.</small>
    </nav>
    <main id="app" tabindex="-1"></main>
    <footer class="page-footer">
      <span>MADE WITH LOVE, BY VISHNU</span><span>എന്റെ Kudu ♡</span>
    </footer>
    <div id="particles" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <dialog id="photo-dialog" aria-label="Photograph">
      <button class="close-modal" aria-label="Close photograph">×</button
      ><img alt="" />
      <p></p>
    </dialog>
    <dialog id="restart-dialog">
      <h2>From the very beginning?</h2>
      <p>This will reset the surprises saved on this device.</p>
      <div class="button-row">
        <button class="secondary" id="cancel-restart">Stay here</button
        ><button class="primary" id="confirm-restart">Begin again ♡</button>
      </div>
    </dialog>
  </body>
</html>
